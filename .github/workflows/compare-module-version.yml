name: Check module_version consistency

on:
  push:
    paths:
      - '**/locals.tf'
  pull_request:
    paths:
      - '**/locals.tf'

jobs:
  compare:
    name: Compare module_version across locals.tf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify module_version values are identical (if present)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys, pathlib

          pattern = re.compile(r'^\s*module_version\s*=\s*(?:"|\')?(?P<val>.*?)(?:"|\')?\s*$')

          files = sorted([p for p in pathlib.Path('.').rglob('locals.tf')])
          if not files:
              print('No locals.tf files found.')
              sys.exit(0)

          vals = {}

          for p in files:
              text = p.read_text(encoding='utf-8')
              for line in text.splitlines():
                  m = pattern.match(line)
                  if m:
                      val = m.group('val')
                      vals.setdefault(val, []).append(str(p))
                      break

          if not vals:
              print("No 'module_version' occurrences found; nothing to check.")
              sys.exit(0)

          if len(vals) > 1:
              print("ERROR: Found differing 'module_version' values among files:")
              for val, fls in vals.items():
                  print(f"  Value: {val}")
                  for f in fls:
                      print('    ' + f)
              sys.exit(1)

          unique_val = next(iter(vals))
          print(f"All locals.tf files that contain 'module_version' have the same value: {unique_val}")
          PY
